name = "bloom-shelf"
main = "src/worker.js"
account_id = "50d8d7802e87b2e383a6a0c03bf1c532"
compatibility_date = "2026-09-09"
workers_dev = true
preview_urls = false

[build]
command = "node scripts/prepare-assets.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
PUBLIC_BASE_URL = "https://bloom-shelf.pattern-service.workers.dev"
STRIPE_MODE = "live"
DOOR_URL = "https://door.thaliabloom.com"

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
